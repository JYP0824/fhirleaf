[project]
name = "fhirlite"
version = "0.3.0"
description = "FHIRLite: An embedded FHIR R4 search engine for Python on a single SQLite file (standard library only)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
dependencies = []
keywords = ["FHIR", "HL7", "SQLite", "search", "embedded"]
authors = [{ name = "Jaeyun Park" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Healthcare Industry",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Database",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

[project.urls]
Repository = "https://github.com/JYP0824/fhirlite"
Issues = "https://github.com/JYP0824/fhirlite/issues"

[project.scripts]
fhirlite = "fhirlite.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fhirlite"]

[tool.hatch.build.targets.sdist]
include = ["src/fhirlite", "LICENSE", "NOTICE", "README.md", "pyproject.toml"]
